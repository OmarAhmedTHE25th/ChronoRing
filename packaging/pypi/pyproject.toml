[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoring"
version = "1.2.0"
description = "Thin Python bindings, live columnar stream reader, and Web Dashboard for ChronoRing"
readme = "../../README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["../../python"]
