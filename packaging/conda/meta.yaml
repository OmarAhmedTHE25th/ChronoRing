{% set name = "chronoring" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/OmarAhmedTHE25th/ChronoRing/archive/refs/tags/v{{ version }}.tar.gz

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.20
    - ninja

test:
  commands:
    - chronoring --version

about:
  home: https://github.com/OmarAhmedTHE25th/ChronoRing
  license: MIT
  summary: Lock-free C++20 telemetry ring buffer, SIMD trigger, and columnar store
