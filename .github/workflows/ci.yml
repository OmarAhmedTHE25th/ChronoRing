name: ChronoRing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
            cmake_flags: ""
            run_bench: true
          - name: Clang Release
            cc: clang
            cxx: clang++
            build_type: Release
            cmake_flags: "-DCHRONORING_BUILD_SHARED=ON"
            run_bench: false
          - name: ASan + UBSan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            cmake_flags: "-DCHRONORING_ENABLE_ASAN_UBSAN=ON -DCHRONORING_BUILD_BENCHMARKS=OFF"
            run_bench: false
          - name: ThreadSanitizer (TSan)
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            cmake_flags: "-DCHRONORING_ENABLE_TSAN=ON -DCHRONORING_BUILD_BENCHMARKS=OFF"
            run_bench: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev libbenchmark-dev

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests (CTest)
        run: ctest --test-dir build --output-on-failure

      - name: Run CLI demo, replay, Prometheus & JSON report
        if: matrix.build_type == 'Release'
        run: |
          ./build/chronoring --version
          ./build/chronoring --demo 50000 build/demo.crng
          ./build/chronoring --replay build/demo.crng
          ./build/chronoring --prometheus 20000 | grep -q chronoring_events_submitted_total
          ./build/chronoring --json-report build/report.json
          test -s build/report.json

      - name: Run Google Benchmark JSON export
        if: matrix.run_bench
        run: |
          ./build/bench_chronoring --benchmark_min_time=0.05s \
            --benchmark_out=build/bench_results.json \
            --benchmark_out_format=json

      - name: Upload benchmark artifacts
        if: matrix.run_bench
        uses: actions/upload-artifact@v4
        with:
          name: chronoring-linux-benchmarks
          path: |
            build/report.json
            build/bench_results.json

  arm64:
    name: Linux ARM64 (NEON) Release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHRONORING_BUILD_SHARED=ON \
            -DCHRONORING_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests (CTest)
        run: ctest --test-dir build --output-on-failure
      - name: Run Python bindings smoke check
        run: |
          PYTHONPATH=python CHRONORING_LIB=build/libchronoring_core.so python3 python/examples/quickstart.py

  macos:
    name: macOS Clang Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHRONORING_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests (CTest)
        run: ctest --test-dir build --output-on-failure
      - name: Run CLI smoke check
        run: ./build/Release/chronoring --demo 25000 || ./build/chronoring --demo 25000

  windows:
    name: Windows MSVC Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCHRONORING_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run unit tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run CLI smoke check
        run: .\build\Release\chronoring.exe --demo 25000

  fuzz:
    name: Linux Clang LibFuzzer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
      - name: Configure Fuzzers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCHRONORING_BUILD_TESTS=OFF \
            -DCHRONORING_BUILD_BENCHMARKS=OFF \
            -DCHRONORING_BUILD_FUZZERS=ON
      - name: Build Fuzzers
        run: cmake --build build-fuzz --parallel
      - name: Run fuzz_rings & fuzz_columnar
        run: |
          ./build-fuzz/fuzz_rings fuzz/corpus/rings -max_total_time=30
          ./build-fuzz/fuzz_columnar fuzz/corpus/columnar -max_total_time=30
